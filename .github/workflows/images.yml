name: images

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/images.yml"
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/images.yml"

jobs:
  build-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            file: backend/Dockerfile
            image: ghcr.io/${{ github.repository }}/backend
          - name: frontend
            file: frontend/Dockerfile
            image: ghcr.io/${{ github.repository }}/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: trivy-image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: push
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3.7.0
        if: github.event_name == 'push'

      - name: cosign-keyless
        if: github.event_name == 'push'
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "${{ matrix.image }}@${{ steps.push.outputs.digest }}"
