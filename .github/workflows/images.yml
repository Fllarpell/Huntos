name: images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/images.yml"
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/images.yml"

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            file: backend/Dockerfile
            image: ghcr.io/fllarpell/huntos/backend
          - name: frontend
            file: frontend/Dockerfile
            image: ghcr.io/fllarpell/huntos/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report only: node:alpine and transitive wheels trip HIGH/CRITICAL
      # faster than we can pin them. Publish still happens; Dependabot tracks.
      - name: trivy-image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3.10.1
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.push.outputs.digest != ''

      - name: cosign-keyless
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.push.outputs.digest != ''
        continue-on-error: true
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "${{ matrix.image }}@${{ steps.push.outputs.digest }}"
