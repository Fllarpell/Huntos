<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
        background: #090a0c;
        color: #eef0f3;
      }
      main { padding: 14px 16px 18px; }
      label { display: block; font-size: 12px; color: #8a8f9a; margin-bottom: 6px; }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #262930;
        border-radius: 8px;
        padding: 8px 10px;
        background: #0c0e12;
        color: #eef0f3;
      }
      button {
        margin-top: 10px;
        border: 0;
        border-radius: 8px;
        padding: 7px 12px;
        background: #7dd3c7;
        color: #090a0c;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #ok { margin-top: 8px; font-size: 12px; color: #7dd3c7; }
    </style>
  </head>
  <body>
    <main>
      <label for="origin">Адрес HuntOS</label>
      <input id="origin" type="url" placeholder="https://127.0.0.1:8443" />
      <button type="button" id="save">сохранить</button>
      <p id="ok"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
