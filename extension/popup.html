<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 300px;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
        background: #090a0c;
        color: #eef0f3;
      }
      main { padding: 14px 16px 16px; }
      h1 { margin: 0 0 6px; font-size: 15px; font-weight: 650; }
      p { margin: 0 0 10px; color: #8a8f9a; font-size: 12px; }
      #verdict { color: #eef0f3; font-weight: 600; }
      #preview { color: #8a8f9a; }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 8px 10px;
        background: #7dd3c7;
        color: #090a0c;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.ghost {
        margin-top: 8px;
        background: transparent;
        color: #8a8f9a;
        border: 1px solid #262930;
      }
      #letter { margin-top: 8px; }
      button:disabled { opacity: 0.45; cursor: default; }
      #status { margin-top: 10px; min-height: 1.4em; font-size: 12px; color: #7dd3c7; }
    </style>
  </head>
  <body>
    <main>
      <h1>HuntOS</h1>
      <p id="verdict">смотрю страницу…</p>
      <p id="preview"></p>
      <button type="button" id="clip">в inbox</button>
      <button type="button" id="letter" hidden>письмо в форму</button>
      <button type="button" class="ghost" id="force" hidden>всё равно положить</button>
      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
