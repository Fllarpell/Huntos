# Prefer operators over pool.debian.org: lower jitter for Google token expiry
# math and APScheduler cron. makestep 1.0 3: step the clock if offset >1s
# during the first 3 updates (VM first boot), then slew only.
pool ntp.ubuntu.com iburst maxsources 4
pool 0.pool.ntp.org iburst maxsources 2

makestep 1.0 3
rtcsync
cmdport 0
leapsectz right/UTC
