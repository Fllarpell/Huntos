# Drop-in for /etc/ssh/sshd_config.d/ — Ubuntu 24.04 / Debian 12.
# Host keys: we delete RSA/ECDSA after first Ed25519 host key exists.

# ListenAddress is rewritten by 04-ssh.sh / 10-lockdown.sh. Do not pin it here.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM yes
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no

# Algorithm policy: Ed25519 only. RSA host keys are still common on old laptops;
# reject them at the daemon so a leaked RSA key is not an auth path.
PubkeyAcceptedAlgorithms ssh-ed25519
HostKeyAlgorithms ssh-ed25519
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

LoginGraceTime 20
MaxAuthTries 3
MaxSessions 4
MaxStartups 10:30:20
ClientAliveInterval 30
ClientAliveCountMax 2
TCPKeepAlive no

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
DebianBanner no

# SFTP stays for authorized deploy, chrooted via Match if we add a rsync user later.
Subsystem sftp internal-sftp
