# work_finding host profile — sized for a 2–8 GB VPS, not a 100 Gbps edge.
# Values are caps; they do not reserve RAM. Too-large backlogs just waste a few pages.

# --- TCP: BBR + fq ---
# BBR reacts to actual delivery rate / RTT, not loss. Correct default for
# Cloudflare-terminated TLS plus long-RTO scraper egress (hh/hirehi/telegram).
# fq (not fq_codel): BBR's pacing assumes fq. fq_codel + BBR underutilizes.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# SYN cookies stay on even with a bigger backlog: cookies are the last line,
# backlog is the first. 4096 covers a small origin behind CF; 65535 is for
# unsheltered anycast and wastes conntrack on a CRM box.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 4096
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 16384

# Scraper/Telethon are outbound-heavy. Reuse TIME_WAIT for our own SYNs.
# tcp_tw_recycle is gone (and was NAT-unsafe). Do not add it back.
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_slow_start_after_idle = 0

# RFC1337: drop RST to TIME_WAIT (prevents TIME-WAIT assassination).
net.ipv4.tcp_rfc1337 = 1

# --- Anti-spoof / no redirects ---
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# --- Memory ---
# swappiness=10: on a 4 GB box we want reclaim before OOM-kill of postgres,
# but not swap-thrash. 1 is for dedicated DB hosts with 64 GB+ and no swap.
vm.swappiness = 10
# overcommit=0 (heuristic) until Redis lives here. Redis wants 1; postgres
# + sqlite + node on 4 GB with overcommit=1 will OOM in bursts of LLM calls.
vm.overcommit_memory = 0
vm.panic_on_oom = 0
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# --- FD / inotify ---
# 512k is enough for docker + postgres + node on one box. 2M looks cargo-culty
# and slows fork() via larger fd tables for no gain at our fd-in-use.
fs.file-max = 524288
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# --- Kernel self-protection ---
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1
kernel.kexec_load_disabled = 1
kernel.unprivileged_bpf_disabled = 1
kernel.perf_event_paranoid = 3
kernel.sysrq = 0
net.core.bpf_jit_harden = 2

# Hardlink/symlink/fifo/regular in sticky world-writable dirs (Debian already
# sets most of these; pin them so a later package cannot silently loosen).
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# IPv6: if the VPS has no v6 route this still stops v6-only bypass of nftables
# v4 rules. Disable v6 entirely on hosts without an assigned prefix.
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
