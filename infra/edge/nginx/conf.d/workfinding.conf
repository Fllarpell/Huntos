# Origin vhost. TLS 1.3 only. Certs from /etc/nginx/tls (not in git).
# Listen 8080/8443 — published as 80/443 on the host. No NET_BIND_SERVICE.

limit_req_status 429;
limit_conn_status 429;

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  # ACME HTTP-01 if we ever skip CF. Otherwise 80 only exists to redirect.
  location /.well-known/acme-challenge/ {
    root /var/www/acme;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/tls/origin.crt;
  ssl_certificate_key /etc/nginx/tls/origin.key;
  ssl_protocols       TLSv1.3;
  # TLS 1.3 suites are not selected via ssl_ciphers; ssl_conf_command is OpenSSL 1.1.1+.
  ssl_conf_command    Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
  ssl_prefer_server_ciphers off;
  ssl_session_tickets off;
  ssl_stapling off;

  # Cloudflare Authenticated Origin Pulls. Default snippet is a no-op so
  # laptop browsers work. On the VPS: cp snippets/origin-pull.enabled.conf
  # snippets/origin-pull.conf && reload nginx. ssl_verify_client belongs
  # inside this server{} — not in a separate http{} server.
  include /etc/nginx/snippets/origin-pull.conf;

  limit_conn conn 32;
  limit_req  zone=general burst=40 nodelay;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;

  # server_tokens off is global. nginx:alpine has no headers-more.

  location = /api/metrics {
    # Prometheus scrapes backend:8000 on the obs network. Public edge must 404.
    return 404;
  }

  location = /api/ready {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location = /api/health {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location /api/auth {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    # bcrypt on login — 10s is enough, 60s is a slowloris gift.
    proxy_read_timeout 10s;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    # LLM scoring + scrape endpoints are slow; 60s is the ceiling, not the target.
    proxy_read_timeout 60s;
  }

  location / {
    limit_req zone=general burst=40 nodelay;
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }
}

server {
  listen 127.0.0.1:8081;
  server_name localhost;
  allow 127.0.0.1;
  deny all;
  location /stub_status {
    stub_status;
  }
}
