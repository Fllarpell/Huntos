worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  # json-file docker driver already caps rotation; still buffer in-memory.
  access_log /var/log/nginx/access.log combined buffer=32k flush=5s;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 15s;
  keepalive_requests 1000;
  client_max_body_size 8m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 10s;
  reset_timedout_connection on;

  # Least-conn at L7: scrape bursts and LLM calls hold connections; RR would
  # pile long requests onto one replica once we scale backend >1.
  # (Today backend MUST stay at 1 replica — in-process APScheduler.)
  upstream backend {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }
  upstream frontend {
    least_conn;
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  # 10m zone ≈ 160k IPv4 keys. 10 r/s is above a human CRM UI; login is tighter.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  include /etc/nginx/conf.d/*.conf;
}
