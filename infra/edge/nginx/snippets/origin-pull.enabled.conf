# Cloudflare Authenticated Origin Pulls.
# ssl_verify_client on inside the TLS server{} (included from workfinding.conf).
# Without this, anyone who finds the origin IP bypasses Cloudflare WAF.
ssl_client_certificate /etc/nginx/tls/cloudflare-origin-pull-ca.pem;
ssl_verify_client on;
ssl_verify_depth 2;
