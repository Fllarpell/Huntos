global:
  resolve_timeout: 5m

route:
  receiver: ntfy
  group_by: [alertname, severity]
  group_wait: 20s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: page
      receiver: ntfy
      repeat_interval: 1h
    - match:
        severity: ticket
      receiver: ntfy
      repeat_interval: 12h

inhibit_rules:
  - source_match:
      alertname: HostDiskCritical
    target_match:
      alertname: HostDiskFilling
    equal: [mountpoint]

receivers:
  - name: ntfy
    webhook_configs:
      - url: http://ntfy:80/workfinding-alerts
        send_resolved: true
        max_alerts: 8
