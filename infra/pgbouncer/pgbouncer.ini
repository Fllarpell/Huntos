[databases]
jobcrm = host=postgres port=5432 dbname=jobcrm

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer
stats_users = pgbouncer
pool_mode = session
; session, not transaction: SQLAlchemy asyncio + prepared statements break
; under transaction pooling (unnamed statements, SET, LISTEN).
default_pool_size = 10
min_pool_size = 2
reserve_pool_size = 2
max_client_conn = 100
max_db_connections = 30
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options
logfile = /tmp/pgbouncer.log
pidfile = /tmp/pgbouncer.pid
unix_socket_dir = /tmp
server_tls_sslmode = disable
; enable when postgres has ssl=on and an internal CA
; server_tls_sslmode = verify-full
; server_tls_ca_file = /etc/pgbouncer/ca.crt
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
