# No trust, no md5, no 0.0.0.0/0. SCRAM only. Replication slot reserved.
local   all             postgres                                peer
local   all             all                                     scram-sha-256
# Docker user-defined bridge. Compose network 172.18.0.0/16 is NOT stable
# across hosts; we match the compose subnet we pin (10.200.0.0/24).
host    all             all             10.200.10.0/24          scram-sha-256
host    replication     replicator      10.200.10.0/24          scram-sha-256
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
