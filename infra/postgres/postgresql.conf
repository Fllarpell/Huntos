# PostgreSQL 16 — single-node origin sized for 4 GB RAM shared with app+obs.
# Do not copy RDS "large" presets; they starve the rest of the box.

listen_addresses = '*'
port = 5432
max_connections = 40
# PgBouncer sits in front; 40 backend conns * ~10 MB ≈ 400 MB ceiling.

shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 4MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200

# Durability: replica-ready WAL even before a standby exists. Switching
# wal_level later requires a restart and a new base backup.
wal_level = replica
max_wal_senders = 4
max_replication_slots = 4
hot_standby = on
archive_mode = on
# %f/%p are postgres substitutions. test ! -f prevents overwrite (WORM-ish locally).
# Replace with `wal-g wal-push %p` once the S3/B2 Object-Lock bucket exists.
archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
archive_timeout = 300
wal_compression = on
min_wal_size = 80MB
max_wal_size = 1GB

ssl = off
password_encryption = scram-sha-256

log_min_duration_statement = 500
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C'
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# Autovacuum aggressive enough for a write-heavy scrape ingest table.
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
